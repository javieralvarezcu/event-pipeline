# Entorno de desarrollo: solo las dependencias externas (SQL Server).
# La API se ejecuta y depura desde Visual Studio (F5) contra este contenedor.
# Uso:  docker compose -f docker-compose.dev.yml up -d
#
# Producción sigue usando docker-compose.yml (API + cloudflared, BD externa).

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eventpipeline-dev-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # Deben coincidir con la connection string de appsettings.Development.json
      # (localhost,1434 / sa / Your_password123).
      SA_PASSWORD: "Your_password123"
    ports:
      - "1434:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  sqlserver-data:
