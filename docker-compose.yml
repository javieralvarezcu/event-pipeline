# Producción: API REST + WebUI (Blazor/Hangfire) + túnel cloudflared, con la BD en
# un fichero SQLite (volumen "data", montado en /data en web y api).
# La BD la crean y migran las migraciones EF al arrancar la Web.
# cloudflared enruta por path (configurado en el dashboard de Cloudflare):
#   /            -> web:8080   (la UI de gestión)
#   /api/*       -> api:8080   (la API REST)
#   /swagger*    -> api:8080
services:
  api:
    build:
      context: .
      dockerfile: src/EventPipeline.Api/Dockerfile
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Data Source=/data/eventpipeline.db"
    volumes:
      - data:/data
    depends_on:
      - web   # la Web crea y migra la BD; la Api no migra
    restart: unless-stopped
    mem_limit: 256m

  web:
    build:
      context: .
      dockerfile: src/EventPipeline.Web/Dockerfile
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Data Source=/data/eventpipeline.db"
      # La Web crea la BD y aplica las migraciones al arrancar (BD propia: seguro;
      # la Api no migra para no competir con ella en el arranque).
      Database__MigrateOnStartup: "true"
      # Web UI administrator seeded on first boot (password forced to change on first login).
      Auth__AdminUsername: ${ADMIN_USERNAME:-admin}
      Auth__InitialAdminPassword: ${INITIAL_ADMIN_PASSWORD:?define INITIAL_ADMIN_PASSWORD en .env}
    volumes:
      - data:/data
    restart: unless-stopped
    mem_limit: 384m

  cloudflared:
    image: cloudflare/cloudflared:2026.11.0
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?falta TUNNEL_TOKEN en .env}
    restart: unless-stopped
    mem_limit: 128m

volumes:
  data:
